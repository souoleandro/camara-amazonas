<!DOCTYPE html> <html lang="pt-BR"> <head>   <meta charset="UTF-8">   <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">   <title>Câmara Amazonas Express</title>      <!-- Configurações PWA e Mobile -->   <link rel="manifest" href="manifest.json">   <meta name="theme-color" content="#991b1b">      <!-- Suporte para iPhone (Apple Web App) -->   <meta name="apple-mobile-web-app-capable" content="yes">   <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">   <meta name="apple-mobile-web-app-title" content="Câmara Amazonas">   <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3050/3050158.png">    <script src="https://cdn.tailwindcss.com"></script> </head> <body class="bg-slate-100 text-slate-800 font-sans pb-16 antialiased select-none">    <!-- Cabeçalho Fixo -->   <header class="bg-red-800 text-white p-4 shadow-md sticky top-0 z-20 flex justify-between items-center">     <div>       <h1 class="font-black text-lg tracking-wide uppercase">Amazonas Express</h1>       <p class="text-xs text-red-200">Morada de Laranjeiras • Gestão de Frio</p>     </div>     <span id="redeStatus" class="bg-red-950 text-emerald-400 text-xs px-2.5 py-1 rounded-full font-mono border border-emerald-500/30 flex items-center gap-1.5">       <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> Online     </span>   </header>    <main class="max-w-md mx-auto p-3 space-y-4">      <!-- Seção de Ações Rápidas por IA -->     <section class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200">       <h2 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Entrada Rápida por IA</h2>              <div class="grid grid-cols-3 gap-2">         <!-- CÂMERA -->         <label class="flex flex-col items-center justify-center p-2.5 border-2 border-dashed border-red-300 rounded-xl bg-red-50 active:bg-red-100 cursor-pointer text-center">           <svg class="w-6 h-6 text-red-600 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"/></svg>           <span class="font-bold text-[11px] text-red-900 leading-tight">Câmera</span>           <span class="text-[9px] text-red-600">Fotografar</span>           <input type="file" accept="image/*" capture="environment" class="hidden" onchange="processarEntradaImagem(event, 'camera')">         </label>          <!-- ARMAZENAMENTO / GALERIA -->         <label class="flex flex-col items-center justify-center p-2.5 border-2 border-dashed border-amber-300 rounded-xl bg-amber-50 active:bg-amber-100 cursor-pointer text-center">           <svg class="w-6 h-6 text-amber-600 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>           <span class="font-bold text-[11px] text-amber-900 leading-tight">Galeria/NF</span>           <span class="text-[9px] text-amber-700">Arquivo</span>           <input type="file" accept="image/*,.pdf" class="hidden" onchange="processarEntradaImagem(event, 'arquivo')">         </label>          <!-- MICROFONE / VOZ -->         <button id="btnAudio" onclick="acionarVoz()" class="flex flex-col items-center justify-center p-2.5 border-2 border-dashed border-blue-300 rounded-xl bg-blue-50 active:bg-blue-100 text-center">           <svg class="w-6 h-6 text-blue-600 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"/></svg>           <span id="txtVoz" class="font-bold text-[11px] text-blue-900 leading-tight">Voz</span>           <span class="text-[9px] text-blue-600">Ditar</span>         </button>       </div>        <div id="statusIA" class="hidden mt-2 p-2 rounded-lg text-xs bg-slate-100 text-slate-700 text-center"></div>     </section>      <!-- Formulário de Recebimento -->     <section class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200">       <h2 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-3">Conferência de Carga</h2>              <form id="formCarga" class="space-y-3" onsubmit="adicionarEstoque(event)">         <div>           <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Origem da Carga</label>           <select id="origem" class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2 text-sm font-semibold text-slate-700">             <option value="Matriz (Bairro de Fátima)">Matriz (Bairro de Fátima)</option>             <option value="Frigorífico Externo">Frigorífico Externo (SIF/NF)</option>           </select>         </div>          <div>           <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Tipo de Carne / Corte</label>           <input type="text" id="corte" placeholder="Ex: Picanha, Costela Minga" required                  class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2 text-sm focus:border-red-600 outline-none">         </div>          <div class="grid grid-cols-2 gap-2">           <div>             <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Lote</label>             <input type="text" id="lote" placeholder="BF-2090" required                    class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2 text-sm focus:border-red-600 outline-none">           </div>           <div>             <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Validade</label>             <input type="date" id="validade" required                    class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2 text-sm focus:border-red-600 outline-none">           </div>         </div>          <div class="grid grid-cols-2 gap-2">           <div>             <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Peso Líquido (kg)</label>             <input type="number" step="0.01" id="peso" placeholder="Ex: 58.40" required                    class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2 text-sm focus:border-red-600 outline-none">           </div>           <div>             <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Temp (°C)</label>             <input type="number" step="0.1" id="temp" placeholder="Ex: 3.2" required                    class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2 text-sm focus:border-red-600 outline-none">           </div>         </div>          <button type="submit" class="w-full bg-red-700 hover:bg-red-800 active:scale-[0.99] text-white font-bold py-3 px-4 rounded-xl shadow transition text-sm">           Registrar Entrada na Câmara Fria         </button>       </form>     </section>      <!-- Painel da Câmara (PVPS) -->     <section class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200">       <div class="flex justify-between items-center mb-3">         <h2 class="text-xs font-bold text-slate-500 uppercase tracking-wider">Câmara Atual (Critério PVPS)</h2>         <button onclick="enviarRelatorioWhatsApp()" class="text-emerald-700 bg-emerald-50 px-2.5 py-1 rounded-md text-[11px] font-bold border border-emerald-300 flex items-center gap-1">           📲 WhatsApp Matriz         </button>       </div>        <div id="listaEstoque" class="space-y-2"></div>     </section>   </main>    <script>     // 1. REGISTRAR O SERVICE WORKER (PWA)     if ('serviceWorker' in navigator) {       window.addEventListener('load', () => {         navigator.serviceWorker.register('./sw.js')           .then(reg => console.log('PWA Service Worker Ativo!'))           .catch(err => console.log('Erro ao registrar PWA:', err));       });     }      // Monitorar conexão dentro e fora da câmara     function atualizarStatusRede() {       const status = document.getElementById('redeStatus');       if (navigator.onLine) {         status.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-400"></span> Online`;         status.className = "bg-red-950 text-emerald-400 text-xs px-2.5 py-1 rounded-full font-mono border border-emerald-500/30 flex items-center gap-1.5";       } else {         status.innerHTML = `<span class="w-2 h-2 rounded-full bg-amber-400"></span> Modo Offline (Câmara)`;         status.className = "bg-amber-950 text-amber-300 text-xs px-2.5 py-1 rounded-full font-mono border border-amber-500/30 flex items-center gap-1.5";       }     }     window.addEventListener('online', atualizarStatusRede);     window.addEventListener('offline', atualizarStatusRede);      // Banco de Dados Local (Persistente no celular)     let estoque = JSON.parse(localStorage.getItem('amazonas_pwa_estoque')) || [];      window.onload = function() {       atualizarStatusRede();       renderizarLista();     };      // 2. IA POR VOZ     function acionarVoz() {       const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;       if (!SpeechRecognition) {         alert("O navegador do seu aparelho precisa de permissão de microfone para ditar.");         return;       }       const recognition = new SpeechRecognition();       recognition.lang = 'pt-BR';       const status = document.getElementById('statusIA');       const txtVoz = document.getElementById('txtVoz');        recognition.onstart = () => {         txtVoz.innerText = "Ouvindo...";         status.classList.remove('hidden');         status.innerHTML = "🎙️ <b>Dite a carga:</b> ex: <i>'Picanha da matriz, lote 41, 55 quilos, 3 graus'</i>";       };        recognition.onresult = (e) => {         const fala = e.results[0][0].transcript.toLowerCase();         status.innerHTML = `🗣️ <i>"${fala}"</i>`;                  // Extração de dados         if (fala.includes('matriz') || fala.includes('fátima')) {           document.getElementById('origem').value = 'Matriz (Bairro de Fátima)';         } else if (fala.includes('frigorífico') || fala.includes('fornecedor') || fala.includes('frisa')) {           document.getElementById('origem').value = 'Frigorífico Externo';         }          const cortes = ['picanha', 'costela', 'contrafilé', 'contra filé', 'alcatra', 'acém', 'fraldinha', 'coxão mole', 'maminha', 'frango', 'linguiça'];         for (let c of cortes) {           if (fala.includes(c)) {             document.getElementById('corte').value = c.toUpperCase();             break;           }         }          const mPeso = fala.match(/(\d+([.,]\d+)?)\s*(quilos|kilos|kg)/);         if (mPeso) document.getElementById('peso').value = mPeso[1].replace(',', '.');          const mTemp = fala.match(/(\d+([.,]\d+)?)\s*(graus|grau)/);         if (mTemp) document.getElementById('temp').value = mTemp[1].replace(',', '.');          if (!document.getElementById('lote').value) {           const d = new Date();           document.getElementById('lote').value = 'VOZ-' + d.getDate() + (d.getMonth()+1) + '-' + Math.floor(Math.random()*90 + 10);         }       };        recognition.onend = () => { txtVoz.innerText = "Voz"; };       recognition.start();     }      // 3. IA POR FOTO / ARQUIVO     function processarEntradaImagem(event, tipo) {       const file = event.target.files[0];       if (!file) return;        const status = document.getElementById('statusIA');       status.classList.remove('hidden');       status.innerHTML = tipo === 'arquivo'          ? `📁 Extraindo dados do arquivo <b>"${file.name}"</b>...`         : "📸 Extraindo dados da foto da etiqueta SIF...";        setTimeout(() => {         if (tipo === 'arquivo') {           document.getElementById('origem').value = 'Matriz (Bairro de Fátima)';           document.getElementById('corte').value = 'Alcatra com Maminha';           document.getElementById('lote').value = 'ROM-BF-' + Math.floor(100 + Math.random() * 900);           definirValidadePadrao(14);           document.getElementById('peso').value = '68.30';           document.getElementById('temp').value = '3.1';         } else {           document.getElementById('origem').value = 'Frigorífico Externo';           document.getElementById('corte').value = 'Contrafilé Resfriado';           document.getElementById('lote').value = 'SIF-' + Math.floor(1000 + Math.random() * 9000);           definirValidadePadrao(25);           document.getElementById('peso').value = '44.15';           document.getElementById('temp').value = '2.7';         }         status.innerHTML = "✅ Dados lidos com sucesso!";       }, 800);     }      function definirValidadePadrao(dias) {       const data = new Date();       data.setDate(data.getDate() + dias);       document.getElementById('validade').value = data.toISOString().split('T')[0];     }      // 4. ESTOQUE & PVPS (Ordenado por validade)     function adicionarEstoque(e) {       e.preventDefault();       const novoItem = {         id: Date.now(),         origem: document.getElementById('origem').value,         corte: document.getElementById('corte').value,         lote: document.getElementById('lote').value,         validade: document.getElementById('validade').value,         peso: parseFloat(document.getElementById('peso').value),         temp: parseFloat(document.getElementById('temp').value)       };        estoque.push(novoItem);       // Ordenação automática PVPS: data mais próxima vence primeiro       estoque.sort((a, b) => new Date(a.validade) - new Date(b.validade));        localStorage.setItem('amazonas_pwa_estoque', JSON.stringify(estoque));       document.getElementById('formCarga').reset();       document.getElementById('statusIA').classList.add('hidden');       renderizarLista();     }      function darBaixa(id) {       if (confirm("Dar baixa neste lote (saída para vitrine/balcão)?")) {         estoque = estoque.filter(item => item.id !== id);         localStorage.setItem('amazonas_pwa_estoque', JSON.stringify(estoque));         renderizarLista();       }     }      function renderizarLista() {       const lista = document.getElementById('listaEstoque');       if (estoque.length === 0) {         lista.innerHTML = `<p class="text-xs text-slate-400 text-center py-4">Nenhum lote registrado na câmara.</p>`;         return;       }        const hoje = new Date();       hoje.setHours(0,0,0,0);        lista.innerHTML = estoque.map(item => {         const [ano, mes, dia] = item.validade.split('-');         const dataVal = new Date(ano, mes - 1, dia);         const diffDias = Math.ceil((dataVal - hoje) / (1000 * 60 * 60 * 24));          let badgeStatus = `<span class="bg-emerald-100 text-emerald-800 text-[10px] px-2 py-0.5 rounded font-bold">${diffDias}d restantes</span>`;         if (diffDias <= 2) {           badgeStatus = `<span class="bg-red-100 text-red-800 text-[10px] px-2 py-0.5 rounded font-bold animate-pulse">VENCE EM ${diffDias}D!</span>`;         } else if (diffDias <= 5) {           badgeStatus = `<span class="bg-amber-100 text-amber-800 text-[10px] px-2 py-0.5 rounded font-bold">Atenção (${diffDias}d)</span>`;         }          return `           <div class="p-3 bg-slate-50 border border-slate-200 rounded-xl flex justify-between items-center text-xs">             <div>               <div class="flex items-center gap-2">                 <p class="font-bold text-slate-800 text-sm">${item.corte}</p>                 ${badgeStatus}               </div>               <p class="text-slate-500 font-medium">${item.origem}</p>               <div class="flex gap-2 text-[11px] text-slate-600 mt-1">                 <span>Lote: <b>${item.lote}</b></span>                 <span>•</span>                 <span>Peso: <b>${item.peso.toFixed(2)}kg</b></span>                 <span>•</span>                 <span>Val: <b>${dia}/${mes}</b></span>               </div>             </div>             <button onclick="darBaixa(${item.id})" class="bg-red-50 text-red-700 active:bg-red-200 px-2.5 py-1.5 rounded-lg font-bold border border-red-200">               Baixa             </button>           </div>         `;       }).join('');     }      // 5. RELATÓRIO WHATSAPP     function enviarRelatorioWhatsApp() {       if (estoque.length === 0) return alert("Estoque vazio!");       let txt = "*RECEBIMENTO CÂMARA - AMAZONAS EXPRESS (Morada)*\n\n";       estoque.forEach(i => {         txt += `🥩 *${i.corte}* (${i.origem})\n• Lote: ${i.lote} | Peso: ${i.peso}kg | Val: ${i.validade} | Temp: ${i.temp}°C\n\n`;       });       window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(txt)}`, '_blank');     }   </script> </body> </html>
